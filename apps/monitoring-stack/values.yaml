alertmanager:
  alertmanagerSpec:
    secrets:
    - alertmanager-telegram
  config:
    global:
      resolve_timeout: 5m
    receivers:
    - name: "null"
    - name: telegram
      telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
        chat_id: 665878262
        parse_mode: HTML
        send_resolved: true
    route:
      group_by:
      - alertname
      - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: telegram
      routes:
      - matchers:
        - alertname = "Watchdog"
        receiver: "null"
      - matchers:
        - alertname = "InfoInhibitor"
        receiver: "null"
      - matchers:
        - severity = "info"
        receiver: "null"
    templates:
    - /etc/alertmanager/config/*.tmpl
defaultRules:
  disabled:
    KubeControllerManagerDown: true
    KubeControllerManagerInstanceUnreachable: true
    KubeProxyDown: true
    KubeProxyInstanceUnreachable: true
    KubeSchedulerDown: true
    KubeSchedulerInstanceUnreachable: true
    etcdDatabaseHighFragmentationRatio: true
    etcdDatabaseQuotaLowSpace: true
    etcdExcessiveDatabaseGrowth: true
    etcdGRPCRequestsSlow: true
    etcdHighCommitDurations: true
    etcdHighFsyncDurations: true
    etcdHighNumberOfFailedGRPCRequests: true
    etcdHighNumberOfFailedProposals: true
    etcdHighNumberOfLeaderChanges: true
    etcdInsufficientMembers: true
    etcdMemberCommunicationSlow: true
    etcdMembersDown: true
    etcdNoLeader: true
grafana:
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: longhorn
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 10d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn

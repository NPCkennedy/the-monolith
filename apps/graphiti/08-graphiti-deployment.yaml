apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphiti-mcp
  namespace: spencer-os
  labels:
    app: graphiti-mcp
    app.kubernetes.io/part-of: spencer-os
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume: the old pod must release it before the new one starts
  selector:
    matchLabels:
      app: graphiti-mcp
  template:
    metadata:
      labels:
        app: graphiti-mcp
        app.kubernetes.io/part-of: spencer-os
    spec:
      # Prevents K8s service-link env vars from polluting the container's environment
      enableServiceLinks: false
      containers:
        - name: graphiti-mcp
          # Runs graphiti-mcp plus an embedded FalkorDB; data lives in /var/lib/falkordb/data.
          # Pinned: graphiti is pre-1.0, breaking changes likely on bumps.
          image: zepai/knowledge-graph-mcp:1.0.1-graphiti-0.23.1
          ports:
            - containerPort: 8000
              name: mcp
          env:
            # LLM for entity extraction — OpenRouter
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: graphiti-config
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: MODEL_NAME
              value: "anthropic/claude-haiku-4-5"
            - name: EMBEDDER_MODEL_NAME
              value: "openai/text-embedding-3-small"
            # This server reads GRAPHITI_GROUP_ID (GROUP_ID is ignored); one graph per group
            - name: GRAPHITI_GROUP_ID
              value: "spencer"
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: graphiti-data

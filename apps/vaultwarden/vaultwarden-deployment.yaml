apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: default
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vaultwarden-data
      containers:
      - name: vaultwarden
        image: vaultwarden/server:1.37.4
        volumeMounts:
        - name: data
          mountPath: /data
        ports:
        - containerPort: 80
        env:
        - name: DOMAIN
          value: https://vaultwarden.homelab.local
        - name: SIGNUPS_ALLOWED
          value: "false"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vaultwarden-db-credentials
              key: database-url